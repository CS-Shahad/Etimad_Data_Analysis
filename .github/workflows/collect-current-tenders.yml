name: Collect Current Tenders

# Collects the full tender listing via AllSupplierTendersForVisitorAsync
# with PublishDateId=1 ("any time" - confirmed 2026-11-03 this returns the
# full ~291,000-tender archive, not just a rolling window).
#
# Plain offset pagination hard-fails (400) once (pageNumber-1)*PageSize
# passes ~185,000, regardless of PageSize - a true depth limit (confirmed
# 2026-11-04), and the server's default order isn't reliably chronological
# either. Fix: collect once per sort direction in
# current_tenders.collect_directions (config.yaml) - ASC starts at the
# archive's true beginning (2019-12-05), DESC starts "now" - each walking
# until it hits its own depth wall. Since 185,000+185,000 exceeds the
# ~291,000 total, the two together cover the full archive with overlap to
# spare. Each direction has its own checkpoint
# (data/raw/checkpoint_current_tenders_<direction>.json) and its own share
# of the time budget below, so one run makes progress on both instead of
# one direction starving the other - and the committed current_tenders.csv
# is the durable state either way, since GitHub Actions runners are
# ephemeral.
#
# Note: the schedule trigger only fires from whatever this file looks like
# on the repo's default branch. Use "Run workflow" (workflow_dispatch) to
# trigger it manually on a feature branch before that's merged.
#
# Shares the "etimad-scraping" concurrency group with
# fetch-tender-details.yml so the two never hit Etimad's server at the
# same time, regardless of schedule drift. Offset 3 hours from that
# workflow's 0/6/12/18 UTC schedule so they normally alternate too.

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Time budget for this run, in minutes (split evenly across sort directions)"
        required: false
        default: "330"

concurrency:
  group: etimad-scraping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild local database from committed CSVs
        run: python scripts/rebuild_db_from_csv.py

      - name: Collect current tenders
        env:
          COLLECT_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '330' }}
        run: python scripts/collect_current_tenders_full.py

      - name: Export results back to CSV
        if: always()
        run: python scripts/export_current_tenders_csv.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/current_tenders.csv
          shopt -s nullglob
          for f in data/raw/checkpoint_current_tenders_*.json; do
            git add "$f"
          done
          # A direction that finished this run deletes its own checkpoint -
          # drop it from the index too instead of leaving a stale tracked file.
          for tracked in $(git ls-files 'data/raw/checkpoint_current_tenders_*.json'); do
            if [ ! -f "$tracked" ]; then
              git rm --cached --ignore-unmatch "$tracked"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update current tenders collection progress [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
