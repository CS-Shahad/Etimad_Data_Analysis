name: Collect Current Tenders

# Collects the full tender listing via AllSupplierTendersForVisitorAsync
# with PublishDateId=1 ("any time" - confirmed 2026-11-03 this returns the
# full ~291,000-tender archive, not just a rolling window).
#
# Plain pagination hard-fails (400) past some depth regardless of sort -
# confirmed 2026-11-04: ~185,000 for DESC/no-sort, but only ~4,500 for ASC
# (a much less efficient query plan in that direction). Collecting both
# sort directions to meet in the middle didn't work: ASC's wall is too
# shallow to cover the archive.
#
# Fix: date-partition the archive by calendar year
# (etimad_scraper/date_partitions.py), using the site's own last-offer-
# presentation-date range filter - confirmed 2026-11-05 a single year
# (2020) reports totalCount=15,653, comfortably under the depth wall, so
# every request's result set stays small enough to never approach it,
# collected with the cheap DESC sort. Each partition has its own
# checkpoint (data/raw/checkpoint_current_tenders_<year>.json) carrying a
# "status": "done" marker once complete, so a finished year is skipped
# outright on later runs instead of needing to be re-collected, and any
# time budget is one deadline shared across the partitions still pending,
# worked through oldest-first until each is actually done (or hits a real
# error) rather than split into a fixed slice per partition upfront -
# confirmed 2026-11-06 that splitting it could cut off a partition making
# steady progress while a later partition's slice went unused after
# failing in seconds. The committed current_tenders.csv is the durable
# state either way, since GitHub Actions runners are ephemeral.
#
# Note: the schedule trigger only fires from whatever this file looks like
# on the repo's default branch. Use "Run workflow" (workflow_dispatch) to
# trigger it manually on a feature branch before that's merged.
#
# Shares the "etimad-scraping" concurrency group with
# fetch-tender-details.yml so the two never hit Etimad's server at the
# same time, regardless of schedule drift. Offset 3 hours from that
# workflow's 0/6/12/18 UTC schedule so they normally alternate too.

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Time budget for this run, in minutes (one deadline shared across pending year partitions, worked through oldest-first)"
        required: false
        default: "330"

concurrency:
  group: etimad-scraping
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild local database from committed CSVs
        run: python scripts/rebuild_db_from_csv.py

      - name: Collect current tenders
        env:
          COLLECT_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '330' }}
        run: python scripts/collect_current_tenders_full.py

      - name: Export results back to CSV
        if: always()
        run: python scripts/export_current_tenders_csv.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/current_tenders.csv
          shopt -s nullglob
          for f in data/raw/checkpoint_current_tenders_*.json; do
            git add "$f"
          done
          # Defensive: a completed partition's checkpoint is kept (with a
          # "status": "done" marker), never deleted, but drop any tracked
          # checkpoint from the index if it's ever missing from disk rather
          # than leaving a stale file committed.
          for tracked in $(git ls-files 'data/raw/checkpoint_current_tenders_*.json'); do
            if [ ! -f "$tracked" ]; then
              git rm --cached --ignore-unmatch "$tracked"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update current tenders collection progress [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
