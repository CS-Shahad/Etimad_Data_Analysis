base_url: "https://tenders.etimad.sa"

current_tenders:
  bootstrap_path: "/Tender/AllTendersForVisitor"
  api_path: "/Tender/AllSupplierTendersForVisitorAsync"
  # PublishDateId=5 was captured from a live browser session (unknown meaning yet -
  # totalCount looked like the full listing though, so left as-is for now).
  default_params:
    PublishDateId: 5
  # PoC confirmed (2026-08-14): server echoes back whatever PageSize is
  # requested but actually caps returned rows at ~24 regardless. Requesting
  # a generous value here is harmless - collect_all_pages() adapts to the
  # real length of each response instead of trusting this number.
  page_size_candidates: [6, 50, 100, 500]
  collect_page_size: 100

# Per-tender extras, only fetched for already-ended tenders (see
# db.get_ended_tenders / scripts/find_ended_tenders.py) since an open
# tender's award tab is always empty.
tender_details:
  details_page_path: "/Tender/DetailsForVisitor"
  awarding_results_path: "/Tender/GetAwardingResultsForVisitorViewComponenet"
  basic_info_report_path: "/Tender/OpenTenderDetailsReportForVisitor"

request:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
  # Random delay between requests, in seconds, to stay respectful of a
  # government server. Widened from 1.5-3.0s (2026-08-14: the server still
  # returned 429 after ~177 consecutive pages at that rate).
  min_delay_seconds: 2.0
  max_delay_seconds: 4.5
  timeout_seconds: 20
  # How fetch_tenders_page backs off and retries on 429 instead of aborting
  # the run. Starts at a flat 60s (the server's own rate-limit window is
  # unknown, so this is a deliberately conservative floor) and grows
  # exponentially from there if it keeps getting rate-limited.
  rate_limit_retry:
    max_retries: 6
    default_backoff_seconds: 60.0
    max_backoff_seconds: 300.0

storage:
  sqlite_path: "data/raw/etimad.db"
  checkpoint_path: "data/raw/checkpoint_current_tenders.json"
  # Committed to the repo (unlike the raw .db/.json above) so a collected
  # snapshot survives even if the Codespace it was gathered in gets deleted.
  csv_export_path: "data/processed/current_tenders.csv"
  # Working list, regenerated on demand - not committed (data/processed/*.csv
  # is gitignored except current_tenders.csv specifically).
  ended_tenders_csv_path: "data/processed/ended_tenders.csv"
