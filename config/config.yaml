base_url: "https://tenders.etimad.sa"

current_tenders:
  bootstrap_path: "/Tender/AllTendersForVisitor"
  api_path: "/Tender/AllSupplierTendersForVisitorAsync"
  # Confirmed 2026-11-03 by inspecting the site's own "PublishDateId"
  # <select> (advanced search > "تاريخ نشر المنافسة"): 1=any time (no date
  # restriction), 2=2 days, 3=1 week, 4=1 month, 5=3 months. Every
  # collection run so far used the default (5), meaning all data collected
  # to date was bounded to a rolling 3-month window, not a full archive.
  default_params:
    PublishDateId: 1
  # PoC confirmed (2026-08-14): server echoes back whatever PageSize is
  # requested but actually caps returned rows at ~24 regardless. Requesting
  # a generous value here is harmless - collect_all_pages() adapts to the
  # real length of each response instead of trusting this number.
  page_size_candidates: [6, 50, 100, 500]
  collect_page_size: 100
  # Optional wall-clock budget for collect_current_tenders_full.py, in
  # minutes - same pattern as tender_details.max_runtime_minutes below.
  # With PublishDateId=1 the full archive is ~291,000 tenders (~12,100
  # pages), far more than one run (or one 6-hour-capped Actions job) can
  # finish - the checkpoint lets it resume across many runs.
  max_runtime_minutes: null
  # Confirmed 2026-11-04: pagination hard-fails (400 Bad Request) once the
  # computed offset (pageNumber-1)*PageSize passes ~185,000 for DESC/no-sort,
  # but only ~4,500 for ASC (evidently a much less efficient query plan in
  # that direction - no index to match it, going by the evidence: DESC and
  # no-sort both stay cheap at any depth tested so far, ASC does not).
  # Tried collecting both sort directions to meet in the middle, but ASC's
  # wall is too shallow for that to cover the archive.
  #
  # Fix: date-partition the archive instead (date_partitions.py) using the
  # site's own "آخر موعد لتقديم العروض" (last offer presentation date)
  # range filter - FromLastOfferPresentationDateString/
  # ToLastOfferPresentationDateString, DD/MM/YYYY, confirmed 2026-11-05.
  # One full year (2020) reported totalCount=15,653 - comfortably under
  # the depth wall - so collecting year by year with cheap DESC sort keeps
  # every single request's result set small enough to never approach it.
  # archive_start_year is when 2019-12-05 tenders started showing up
  # (ASC's observed starting point); end year defaults to the current
  # year (date_partitions.year_partitions).
  sort_field: "SubmitionDate"
  archive_start_year: 2019

# Per-tender extras, only fetched for already-ended tenders (see
# db.get_ended_tenders / scripts/find_ended_tenders.py) since an open
# tender's award tab is always empty.
tender_details:
  details_page_path: "/Tender/DetailsForVisitor"
  awarding_results_path: "/Tender/GetAwardingResultsForVisitorViewComponenet"
  basic_info_report_path: "/Tender/OpenTenderDetailsReportForVisitor"
  # A tender that has failed this many times (tender_detail_failures) is
  # excluded from future runs entirely instead of being retried forever.
  # Confirmed 2026-11-03: ~73 tenders with a tender_id_string format this
  # endpoint rejects outright had been retried on every run since
  # mid-August (~295 wasted attempts each) with zero chance of succeeding.
  max_failure_attempts: 3
  # Optional wall-clock budget for fetch_tender_details.py, in minutes.
  # Unset here (no limit) so local/Codespace runs behave as before; the
  # GitHub Actions workflow overrides this via the FETCH_DETAILS_MAX_MINUTES
  # env var, since a single job run is hard-capped at 6 hours and the full
  # ~5700-tender backfill won't finish in one run.
  max_runtime_minutes: null

request:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
  # Random delay between requests, in seconds, to stay respectful of a
  # government server. Widened from 1.5-3.0s (2026-08-14: the server still
  # returned 429 after ~177 consecutive pages at that rate).
  min_delay_seconds: 2.0
  max_delay_seconds: 4.5
  timeout_seconds: 20
  # How fetch_tenders_page backs off and retries on 429 instead of aborting
  # the run. Starts at a flat 60s (the server's own rate-limit window is
  # unknown, so this is a deliberately conservative floor) and grows
  # exponentially from there if it keeps getting rate-limited.
  rate_limit_retry:
    max_retries: 6
    default_backoff_seconds: 60.0
    max_backoff_seconds: 300.0

storage:
  sqlite_path: "data/raw/etimad.db"
  checkpoint_path: "data/raw/checkpoint_current_tenders.json"
  # Committed to the repo (unlike the raw .db/.json above) so a collected
  # snapshot survives even if the Codespace it was gathered in gets deleted.
  csv_export_path: "data/processed/current_tenders.csv"
  # Working list, regenerated on demand - not committed (data/processed/*.csv
  # is gitignored except current_tenders.csv specifically).
  ended_tenders_csv_path: "data/processed/ended_tenders.csv"
  # Committed, like csv_export_path above - lets a fresh GitHub Actions
  # runner (or a fresh Codespace) reconstruct "what's already been fetched"
  # without needing the gitignored etimad.db itself.
  tender_details_csv_path: "data/processed/tender_details.csv"
  tender_bids_csv_path: "data/processed/tender_bids.csv"
  tender_detail_failures_csv_path: "data/processed/tender_detail_failures.csv"
